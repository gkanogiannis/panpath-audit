[package]
name = "panpath-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Audit GFA paths against source FASTA sequences"
authors = ["Anestis Gkanogiannis <ganoyan@gmail.com>"]
repository = "https://github.com/gkanogiannis/panpath-audit"
homepage = "https://github.com/gkanogiannis/panpath-audit"
readme = "README.md"
keywords = ["pangenome", "gfa", "bioinformatics", "genomics", "graph"]
categories = ["command-line-utilities", "science"]
exclude = [
    "/data",
    "/venv",
    "/docs/test-data-notes.md",
    "/initial-prompt.md",
    "/handout.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
blake3 = "1.8"
sha2 = "0.10"
tempfile = "3.21"
